<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask My Docs</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: #f6f5f3;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #555;
    margin: 0 0 24px;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .samples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .sample-btn {
    background: #fff;
    border: 1px solid #d8d5d0;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    color: #333;
  }
  .sample-btn:hover {
    border-color: #999;
  }
  .ask-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  #question {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #d8d5d0;
    border-radius: 8px;
    background: #fff;
  }
  #ask-btn {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #ask-btn:disabled {
    background: #999;
    cursor: default;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e2dd;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #888;
    margin: 0 0 8px;
  }
  #answer-text {
    font-size: 1.05rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .declined { color: #a15c00; }
  .chunk {
    border-top: 1px solid #eee;
    padding: 12px 0;
  }
  .chunk:first-child { border-top: none; padding-top: 0; }
  .chunk-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 0.8rem;
    color: #666;
  }
  .similarity {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #f0efec;
    border-radius: 5px;
    padding: 2px 7px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .chunk-text {
    font-size: 0.9rem;
    color: #333;
    line-height: 1.45;
  }
  .status {
    color: #888;
    font-size: 0.9rem;
  }
  .error {
    color: #b3261e;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask My Docs</h1>
  <p class="subtitle">
    RAG Q&amp;A over a real document. Every answer below is shown next to the
    exact chunks it was retrieved from, with the cosine similarity score
    that got each one past the retrieval threshold — nothing here is taken
    on faith.
  </p>

  <div class="samples">
    <button class="sample-btn" data-q="What did this person do at UnitedHealth Group?">What did this person do at UnitedHealth Group?</button>
    <button class="sample-btn" data-q="What was their MSc dissertation project about?">What was their MSc dissertation project about?</button>
  </div>

  <div class="ask-row">
    <input id="question" type="text" placeholder="Ask a question about the ingested document..." />
    <button id="ask-btn">Ask</button>
  </div>

  <div id="results"></div>
</div>

<script>
  // Demo-only key, already public in the README — the app has no rate limiting
  // beyond this shared secret, so treat it as a low-stakes throwaway key.
  const API_KEY = "thisisthesamplekeyforapp";

  const questionInput = document.getElementById("question");
  const askBtn = document.getElementById("ask-btn");
  const results = document.getElementById("results");

  document.querySelectorAll(".sample-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      questionInput.value = btn.dataset.q;
      ask();
    });
  });

  askBtn.addEventListener("click", ask);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") ask();
  });

  async function ask() {
    const question = questionInput.value.trim();
    if (!question) return;

    askBtn.disabled = true;
    results.innerHTML = '<p class="status">Asking...</p>';

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY,
        },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        results.innerHTML = `<p class="error">Error ${res.status}: ${body.message || res.statusText}</p>`;
        return;
      }

      render(await res.json());
    } catch (err) {
      results.innerHTML = `<p class="error">Request failed: ${err.message}</p>`;
    } finally {
      askBtn.disabled = false;
    }
  }

  function render(data) {
    const answerClass = data.answered ? "" : "declined";
    let html = `
      <div class="card">
        <h2>Answer</h2>
        <div id="answer-text" class="${answerClass}">${escapeHtml(data.answer)}</div>
      </div>
    `;

    if (data.retrieved && data.retrieved.length > 0) {
      html += `<div class="card"><h2>Retrieved chunks (evidence)</h2>`;
      for (const chunk of data.retrieved) {
        html += `
          <div class="chunk">
            <div class="chunk-meta">
              <span>${escapeHtml(chunk.source)}</span>
              <span class="similarity">similarity ${chunk.similarity.toFixed(3)}</span>
            </div>
            <div class="chunk-text">${escapeHtml(chunk.text)}</div>
          </div>
        `;
      }
      html += `</div>`;
    }

    results.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }
</script>
</body>
</html>
